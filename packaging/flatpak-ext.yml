# Flatpak extension: puts the VST3 where Flatpak DAWs (Bitwig, Reaper, Ardour, ...) look for plugins
# (org.freedesktop.LinuxAudio.Plugins). Built from source inside the SDK. @RUNTIME@ must match the DAW's runtime branch.
id: org.freedesktop.LinuxAudio.Plugins.ModxMController
branch: '@RUNTIME@'
runtime: org.freedesktop.LinuxAudio.BaseExtension    # defines the Plugins extension point
runtime-version: '@BASEV@'
sdk: org.freedesktop.Sdk//@RUNTIME@
build-extension: true
separate-locales: false
appstream-compose: false
build-options:
  prefix: /app/extensions/Plugins/ModxMController
modules:
  - name: ModxMController
    buildsystem: simple
    build-options:
      build-args: [--share=network]     # JUCE is fetched at build time by CMake (not at install or run time)
    build-commands:
      - git clone --depth 1 --branch 8.0.16-security https://github.com/juce-framework/JUCE.git third_party/JUCE
      - cmake -S . -B _b -G Ninja -DCMAKE_BUILD_TYPE=Release
      - cmake --build _b --parallel 2 --target ModxMController_VST3
      - mkdir -p /app/extensions/Plugins/ModxMController/vst3
      - cp -r "$(find _b -type d -name '*.vst3' | head -1)" /app/extensions/Plugins/ModxMController/vst3/
    sources:
      - type: dir
        path: .
